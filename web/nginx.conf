# --- konteks http (berkas ini di-include di dalam http{} oleh nginx) -------------------------------------------------
# Akses lewat ngrok selalu membawa X-Forwarded-For (diisi ngrok); akses langsung dari browser di komputer booth tidak.
# Dipakai untuk (1) membatasi halaman alat + endpoint admin ke komputer booth, (2) kunci batas laju per pengunjung.
map $http_x_forwarded_for $via_tunnel { default 1; "" 0; }
map $http_x_forwarded_for $client_key { "" $remote_addr; "~^(?<first>[^,\s]+)" $first; }

# Batas laju per pengunjung (429 bila lewat). ESP32 mengirim 1 bacaan/2–10 s.
limit_req_zone $client_key zone=upload:10m rate=10r/m;
limit_req_zone $client_key zone=sensor:10m rate=3r/s;
limit_req_zone $client_key zone=push:10m rate=10r/m;
limit_req_zone $client_key zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Batas unggahan sama dengan api (10 MB).
    client_max_body_size 10m;

    # Kompresi: menghemat kuota data ngrok gratis (three.js ±1,3 MB -> ±300 KB, casing STL ±60 % lebih kecil).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/stl;
    # (blok types di sini akan mengganti seluruh tabel MIME bawaan, jadi STL diberi tipe lewat location sendiri)
    location ~ \.stl$ {
        default_type model/stl;
        add_header Cache-Control "public, max-age=86400";
    }

    # Server-Sent Events: tanpa buffering agar tiap tahap langsung sampai ke browser.
    # SSE kejadian dua pemicu (Tahap 3): koneksi lama, tanpa buffering; keepalive dari API tiap 15 detik.
    location = /api/events/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location ~ ^/api/jobs/[^/]+/events$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # --- Hanya operator (komputer booth, bukan lewat ngrok): reset baseline, dokumentasi API ---------------------
    location ~ ^/api/(sensor/baseline/reset|docs|redoc|openapi\.json) {
        if ($via_tunnel) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }

    # --- Batas laju per jenis endpoint ----------------------------------------------------------------------------
    location = /api/predict {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://api:8000/predict;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/(sensor|node)/readings$ {
        limit_req zone=sensor burst=5 nodelay;
        client_max_body_size 4k;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }
    location ~ ^/api/push/(subscribe|unsubscribe)$ {
        limit_req zone=push burst=5 nodelay;
        client_max_body_size 4k;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Halaman alat operator (flash firmware, perekam kalibrasi): hanya dari komputer booth.
    location ^~ /tools/ {
        if ($via_tunnel) { return 403; }
        try_files $uri =404;
    }

    # Manifest PWA (pasang ke Home Screen, syarat Web Push di iPhone) dan service worker tanpa cache lama.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
