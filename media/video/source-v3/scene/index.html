<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AirLens video</title>
<style>
@font-face { font-family: "SG"; src: url(/assets/space-grotesk-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "SG"; src: url(/assets/space-grotesk-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "IN"; src: url(/assets/inter-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "IN"; src: url(/assets/inter-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
:root {
  --bg: #060D14; --panel: #0D1B26; --line: #1C3444; --ink: #EAF4FA; --muted: #8FB0C2;
  --sky: #2BA8E0; --cyan: #4FE3F0; --amber: #F2994A; --red: #FF4D5E; --green: #3DDC97;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "IN", sans-serif; }
#gl { position: absolute; inset: 0; }
#ui, #labels, #over { position: absolute; inset: 0; pointer-events: none; }
/* teks utama */
#headline { position: absolute; left: 110px; bottom: 150px; max-width: 1150px; }
#headline .kicker { font: 600 26px "IN"; letter-spacing: 6px; text-transform: uppercase; color: var(--cyan); margin-bottom: 18px; }
#headline h1 { margin: 0; font: 700 86px/1.02 "SG"; letter-spacing: -1.5px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
#headline h1 em { font-style: normal; color: var(--amber); }
#headline h1 b { color: var(--cyan); }
/* sudut */
#corner { position: absolute; top: 40px; right: 48px; display: flex; gap: 22px; align-items: center; background: rgba(255,255,255,.96);
  padding: 10px 22px; border-radius: 16px; }
#corner img.hima { height: 64px; }
#corner img.pcr { height: 30px; }
#brand { position: absolute; top: 44px; left: 56px; height: 58px; }
#footer { position: absolute; left: 56px; bottom: 36px; font: 500 20px "IN"; color: #6F8FA2; letter-spacing: .4px; }
#footer span { color: var(--muted); }
#progress { position: absolute; left: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--sky), var(--cyan)); }
/* label 3D */
.lbl { position: absolute; transform: translate(-50%, 0); text-align: center; width: 300px; }
.lbl .series { font: 700 34px "SG"; color: var(--ink); }
.lbl .role { font: 600 17px "IN"; color: var(--cyan); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 4px; }
.lbl .gas { font: 500 19px/1.35 "IN"; color: var(--muted); margin-top: 8px; }
.lbl .gas b { color: var(--amber); font-weight: 600; }
.lbl::before { content: ""; display: block; width: 2px; height: 46px; margin: 0 auto 10px; background: linear-gradient(var(--cyan), transparent); transform: rotate(180deg); }
.lbl.up{transform:translate(-50%,-100%)}.lbl.up::before{display:none}.lbl.up::after{content:"";display:block;width:2px;height:40px;margin:10px auto 0;background:linear-gradient(var(--cyan),transparent)}
.evbadge{position:absolute;white-space:nowrap;font:600 24px "IN";color:#fff;background:rgba(20,8,10,.85);border:2px solid #FF4D5E;border-radius:12px;padding:10px 18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.evbadge b{color:#FF4D5E;margin-right:8px}
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="ui"></div>
<div id="labels"></div>
<div id="over">
  <img id="brand" src="/assets/airlens_logo_dark.svg" alt="">
  <div id="corner"><img class="hima" src="/assets/logo_hima.jpg" alt=""><img class="pcr" src="/assets/logo_pcr.png" alt=""></div>
  <div id="headline"></div>
  <div id="footer">Illustrative animation <span>·</span> Generated with Claude AI</div>
  <div id="progress"></div>
  <div id="fade" style="position:absolute;inset:0;background:#060D14;opacity:0"></div>
</div>
<script type="module" src="/scene/main.js"></script>
</body>
</html>
